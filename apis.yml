aid: mywear
name: MyWear
description: >-
  MyWear (operating as vPersonalize Inc.) is a Houston, Texas based, Accel-backed
  software company founded in 2014 that provides a cloud platform for on-demand
  apparel manufacturing and mass customization. Its integrated toolset spans the
  full production lifecycle: a 3D product customizer and 3D uniform builder for
  real-time design, an online pattern-making CAD with automated size grading,
  web-to-print and print-layout automation with color management (PANTONE, CMYK,
  custom SPOT), an automated catalog builder, e-commerce storefront integration,
  and order and factory management across multiple suppliers. The company holds
  six US patents covering its automation and pattern-generation technology and
  targets apparel brands, sportswear makers, and print-on-demand operators. The
  public surface is a marketing and product site (vpersonalize.com); no public
  developer portal, API reference, or OpenAPI definition is published as of this
  enrichment pass.
